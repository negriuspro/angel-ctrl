name: Deploy to Ubuntu Server

on:
  push:
    branches:
      - master
      - main

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 15

    steps:
      - name: Pull latest code
        working-directory: ${{ secrets.DEPLOY_PATH }}
        run: git pull origin master || git pull origin main

      - name: Build and restart containers
        working-directory: ${{ secrets.DEPLOY_PATH }}
        run: docker compose up -d --build --remove-orphans

      - name: Wait for backend healthy
        working-directory: ${{ secrets.DEPLOY_PATH }}
        run: |
          RETRIES=0
          until docker compose ps backend | grep -q "healthy" || [ "$RETRIES" -ge 24 ]; do
            sleep 5
            RETRIES=$((RETRIES + 1))
          done
          if [ "$RETRIES" -ge 24 ]; then
            echo "Backend no salio healthy en 2 minutos"
            docker compose logs --tail=40 backend
            exit 1
          fi

      - name: Health check via nginx
        run: |
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/)
          echo "HTTP status: $HTTP"
          [ "$HTTP" = "200" ] || exit 1

      - name: Prune old images
        run: docker image prune -f --filter "until=24h"

      - name: Notify success
        if: success()
        run: echo "Deploy OK - $(date '+%Y-%m-%d %H:%M:%S')"

      - name: Notify failure
        if: failure()
        working-directory: ${{ secrets.DEPLOY_PATH }}
        run: |
          echo "Deploy FALLO - $(date '+%Y-%m-%d %H:%M:%S')"
          docker compose ps
          docker compose logs --tail=50
