name: Deploy angel-ctrl

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to angel-server
    runs-on: [self-hosted, linux, angel-ctrl]
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Deploy
        run: bash /home/angel/deploy/deploy-angel-ctrl.sh

      - name: Verify containers
        if: always()
        run: docker ps --filter name=angel-ctrl --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"

      - name: Deploy log
        if: always()
        run: tail -20 /home/angel/deploy/deploy.log || true
