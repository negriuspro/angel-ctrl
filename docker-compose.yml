name: angel-ctrl

services:

  # ── Backend API ────────────────────────────────────────────────────────────
  backend:
    restart: unless-stopped
    build:
      context: .
      dockerfile: infra/antigravity-backend/Dockerfile
    mem_limit: 400m
    cpus: 0.8
    expose:
      - "8080"
    environment:
      APP_ENV: production
      DOCKER_HOST: unix:///var/run/docker.sock
      CORS_ORIGINS: ${CORS_ORIGINS}
      API_KEY: ${API_KEY}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CLAUDE_CONFIG_DIR: /claude-data
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      CEREBRAS_API_KEY: ${CEREBRAS_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      SAMBANOVA_API_KEY: ${SAMBANOVA_API_KEY:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - claude_data:/claude-data:ro
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8080/health"]
      interval: 20s
      timeout: 8s
      retries: 5
      start_period: 40s
    networks:
      - frontend
      - backend
    security_opt:
      - no-new-privileges:true

  # ── Nginx (static + proxy) ─────────────────────────────────────────────────
  nginx:
    restart: unless-stopped
    build:
      context: .
      dockerfile: infra/antigravity-nginx/Dockerfile
    mem_limit: 48m
    cpus: 0.15
    ports:
      - "${APP_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - frontend
    security_opt:
      - no-new-privileges:true

  # ── Redis ──────────────────────────────────────────────────────────────────
  redis:
    restart: unless-stopped
    image: redis:7-alpine
    mem_limit: 80m
    cpus: 0.2
    command: >
      redis-server
      --appendonly yes
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 64mb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
    volumes:
      - redis_data:/data
    healthcheck:
      # REDISCLI_AUTH oculta la contraseña de `ps aux`
      test: ["CMD", "sh", "-c", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep -q PONG"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks:
      - backend
    security_opt:
      - no-new-privileges:true

volumes:
  redis_data:
    name: angel-ctrl_redis
  claude_data:
    name: angel-ctrl_claude
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${CLAUDE_DATA_PATH}

networks:
  frontend:
    name: angel-ctrl_frontend
    driver: bridge
  backend:
    name: angel-ctrl_backend
    driver: bridge
    internal: true
